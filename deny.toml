[licenses]
confidence-threshold = 0.93
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
exceptions = [
  { allow = ["BSL-1.0"], crate = "clipboard-win@5.4.1" },
  { allow = ["BSL-1.0"], crate = "error-code@3.4.0" },
]

[licenses.private]
ignore = true
