name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vVERSION tag to publish or repair
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64
            os: ubuntu-22.04
          - id: linux-aarch64
            os: ubuntu-24.04-arm
          - id: macos-aarch64
            os: macos-15
          - id: macos-x86_64
            os: macos-15-intel
          - id: windows-x86_64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify release version
        run: sh scripts/check-release-version.sh "$RELEASE_TAG"
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --locked
      - name: Package and verify
        run: sh scripts/package.sh
      - name: Validate Windows installer syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $allErrors = @()
          foreach ($file in @(
            "packaging/windows/Install-Toyoterm.ps1",
            "packaging/windows/Uninstall-Toyoterm.ps1"
          )) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$parseErrors
            )
            $allErrors += $parseErrors
          }
          if ($allErrors.Count -ne 0) { throw ($allErrors | Out-String) }
      - name: Test Windows install, upgrade, and uninstall
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP "toyoterm-installer-test"
          $source = Join-Path $testRoot "source"
          $destination = Join-Path $testRoot "installed"
          New-Item -ItemType Directory -Force -Path $source | Out-Null
          Copy-Item "target/release/toyoterm.exe" $source
          Copy-Item "packaging/windows/Install-Toyoterm.ps1" $source
          Copy-Item "packaging/windows/Uninstall-Toyoterm.ps1" $source
          & (Join-Path $source "Install-Toyoterm.ps1") -InstallDirectory $destination -NoPath -NoStartMenu
          & (Join-Path $source "Install-Toyoterm.ps1") -InstallDirectory $destination -NoPath -NoStartMenu
          $reportedVersion = & (Join-Path $destination "toyoterm.exe") version
          if ($reportedVersion -ne "toyoterm $($env:RELEASE_TAG.TrimStart('v'))") {
            throw "installed executable reported $reportedVersion"
          }
          & (Join-Path $destination "Uninstall-Toyoterm.ps1") -KeepPath -KeepStartMenu
          Start-Sleep -Seconds 1
          if (Test-Path (Join-Path $destination "toyoterm.exe")) {
            throw "uninstaller left toyoterm.exe behind"
          }
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify checksums and create manifest
        run: |
          cd dist
          sha256sum -c -- *.sha256
          find . -maxdepth 1 -type f ! -name '*.sha256' -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag \
              --generate-notes \
              --title "toyoterm ${RELEASE_TAG#v}"
          fi
