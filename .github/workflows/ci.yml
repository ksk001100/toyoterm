name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install GPUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang cmake libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libssl-dev libvulkan1 mesa-vulkan-drivers
      - name: Format
        run: cargo fmt --check
      - name: Check crate architecture
        run: python3 scripts/check-crate-architecture.py
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --locked
      - name: PTY smoke test
        run: cargo run --locked -- pty-demo
      - name: Terminal backend smoke test
        run: cargo run --locked -- screen-demo
      - name: Native GUI smoke test
        if: runner.os != 'Linux'
        run: cargo run --locked -- gui-smoke-test
      - name: Package
        run: sh scripts/package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: toyoterm-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error

  linux-gui:
    strategy:
      fail-fast: false
      matrix:
        display: [x11, wayland]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install display test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config clang cmake libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libssl-dev \
            libvulkan1 \
            libxkbcommon-x11-0 \
            mesa-vulkan-drivers \
            weston \
            xvfb
      - name: X11 GUI smoke test
        if: matrix.display == 'x11'
        run: env -u WAYLAND_DISPLAY xvfb-run -a cargo run --locked -- gui-smoke-test
      - name: Wayland GUI smoke test
        if: matrix.display == 'wayland'
        run: sh scripts/wayland-smoke-test.sh
