[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/toyoterm-cli"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
toyoterm-api = { path = "crates/toyoterm-api" }
toyoterm-app = { path = "crates/toyoterm-app" }
toyoterm-config = { path = "crates/toyoterm-config" }
toyoterm-ipc = { path = "crates/toyoterm-ipc" }
toyoterm-mux = { path = "crates/toyoterm-mux" }
toyoterm-pty = { path = "crates/toyoterm-pty" }
toyoterm-render = { path = "crates/toyoterm-render" }
toyoterm-script = { path = "crates/toyoterm-script" }
toyoterm-terminal = { path = "crates/toyoterm-terminal" }
gpui = "=0.2.2"
async-channel = "2.5.0"
alacritty_terminal = "0.26.0"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
cc = "1.4.5"
portable-pty = "0.9.0"
sys-locale = "0.3.2"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
windows-sys = "0.61.2"

[profile.release]
# PTY and window guards must run even when an unexpected panic reaches main.
panic = "unwind"
