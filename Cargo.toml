[package]
name = "toyoterm"
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
alacritty_terminal = "0.26.0"
arboard = { version = "3.6.1", default-features = false, features = [
  "wayland-data-control",
] }
glyphon = "0.12.0"
pollster = "1.0.1"
sys-locale = "0.3.2"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
unicode-script = "0.5.8"
wgpu = "30.0.1"
winit = "0.30.13"

[target.'cfg(unix)'.dependencies]
portable-pty = "0.9.0"

[target.'cfg(windows)'.dependencies]
conpty-oxide = { version = "0.1.2", features = ["tracing"] }

[build-dependencies]
cc = "1.2.56"

[profile.release]
# PTY and window guards must run even when an unexpected panic reaches main.
panic = "unwind"
