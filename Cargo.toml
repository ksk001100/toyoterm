[package]
name = "toyoterm"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
alacritty_terminal = "0.26.0"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
glyphon = "0.12.0"
pollster = "1.0.1"
portable-pty = "0.9.0"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
wgpu = "30.0.1"
winit = "0.30.13"

[build-dependencies]
cc = "1.2.56"
